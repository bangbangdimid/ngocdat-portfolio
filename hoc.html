<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<body>

<header class="appbar">
  <a class="brand" href="index.html"><img src="assets/ocean/svg/whale-mascot.svg" alt="" />Lớp Toán Ngọc Đạt</a>
  <div class="appbar-right">
    <a class="btn" id="adminLink" href="admin.html" style="display:none">Quản trị</a>
    <span class="user-chip"><span class="dot"></span><span id="userName">…</span></span>
    <button class="btn" id="signOutBtn">Đăng xuất</button>
  </div>
</header>

<!-- loader shown until auth check completes -->
<div id="loader" class="page-loader">Đang tải…</div>

<main class="wrap dash" id="dash" style="display:none">
  <div class="dash-head">
    <div class="hello" id="hello"></div>
    <p class="sub">Các khoá học của bạn. Nhập mã lớp để mở thêm khoá mới.</p>
  </div>

  <div class="redeem-card">
    <div class="lbl">
      <span>Có mã lớp?</span>
      <span class="sub">Nhập mã giáo viên cấp để vào lớp.</span>
    </div>
    <form id="redeemForm">
      <input type="text" id="codeInput" required autocomplete="off" spellcheck="false" placeholder="VD: TOAN9-2026" />
      <button type="submit" class="btn primary" id="redeemBtn">Kích hoạt</button>
    </form>
  </div>

  <div id="courses"></div>
</main>

<div class="toast" id="toast"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
